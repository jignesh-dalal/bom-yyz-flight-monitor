name: BOM→YYZ Flight Monitor

on:
  schedule:
    # Every 2 hours between 06:00 and 22:00 UTC
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Run flight monitor
        run: python3 monitor.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Commit price state if changed
        run: |
          if [ -f prices.json ] && ! git diff --exit-code --quiet prices.json 2>/dev/null; then
            git config user.name "Flight Monitor Bot"
            git config user.email "jignesh.h.dalal+bot@gmail.com"
            git add prices.json
            git commit -m "Update price state [$(date -u +'%Y-%m-%d %H:%M UTC')]"
            git push
            echo "✓ Price state committed"
          else
            echo "✓ Price state unchanged"
          fi
